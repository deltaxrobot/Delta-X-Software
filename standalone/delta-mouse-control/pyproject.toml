[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-mouse-control"
version = "1.0.0"
description = "Standalone Delta X 3 mouse controller and reusable G-code motion engine"
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"
authors = [{name = "Delta X Software contributors"}]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]
gui = ["PySide6>=6.9,<7", "pyserial>=3.5,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
delta-mouse-control = "delta_mouse.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
